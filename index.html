<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 20px auto;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-title { font-weight: bold; margin-top: 10px; font-size: 16px; color: #222; }
        .product-brand { color: #777; font-size: 13px; margin-bottom: 5px; }
        .product-price { color: #28a745; font-weight: bold; font-size: 18px; margin: 5px 0; }
        
        .select-group { margin: 10px 0; display: flex; align-items: center; justify-content: space-between; }
        .select-group select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }

        .btn-add {
            background: #007bff; color: #fff; border: none; padding: 10px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn-add:hover { background: #0056b3; }

        /* Sacola Flutuante / Resumo */
        #cart-bar {
            position: fixed; bottom: 20px; right: 20px; background: #fff;
            padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 320px; width: 90%; z-index: 100;
        }
        .cart-info { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Catálogo de Produtos</h1>

    <div id="products-container">
        <p style="text-align: center; grid-column: 1/-1;">Carregando produtos...</p>
    </div>

    <!-- Barra da Sacola -->
    <div id="cart-bar">
        <div class="cart-info">
            <span id="cart-count">0 item(ns)</span>
            <span id="cart-total">R$ 0,00</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <button onclick="pagarComPixDireto()" style="background: #009ee3; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                ⚡ Pagar via Pix no Site
            </button>
            <button onclick="enviarWhatsApp()" style="background: #25d366; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                📲 Finalizar no WhatsApp
            </button>
        </div>
    </div>

    <!-- Modal de Pagamento via Pix na Tela (não usado mais, mantido caso queira reaproveitar depois) -->
    <div id="modal-pix" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:24px; border-radius:12px; max-width:380px; width:90%; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.2); position:relative;">
            <h2 style="margin-top:0; color:#333; font-size:20px;">Pagamento via Pix</h2>
            <p style="font-size:14px; color:#666;">Escaneie o QR Code abaixo com o app do seu banco ou copie o código Pix:</p>
            
            <div id="pix-qr-container" style="margin: 15px 0;">
                <img id="pix-qr-image" src="" alt="QR Code Pix" style="width:200px; height:200px; display:block; margin:0 auto; border:1px solid #ddd; border-radius:8px;" />
            </div>

            <p style="font-size:12px; color:#888;">Chave Pix (Copia e Cola):</p>
            <textarea id="pix-code-text" readonly style="width:100%; height:60px; font-size:11px; padding:6px; border:1px solid #ccc; border-radius:6px; resize:none; font-family:monospace; margin-bottom:10px;"></textarea>

            <button onclick="copiarPix()" style="width:100%; background:#28a745; color:#fff; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px; margin-bottom:8px;">
                📋 Copiar Código Pix
            </button>

            <button onclick="fecharModalPix()" style="width:100%; background:#dc3545; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">
                Fechar
            </button>
        </div>
    </div>

    <script>
        const numeroWhatsApp = "5527997367867"; 
        const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQB3xpKv0dLdsU2QILj7Hjh4egbxidl4rxvH6U_l7QUFuPY1dImQj8_JpgFs0c5C8qe1wzc4swXR5EP/pub?output=csv";

        let sacola = [];

        function formatarUrlImagem(url) {
            if (!url || url.trim() === '') {
                return 'https://via.placeholder.com/300x220?text=Sem+Foto';
            }
            url = url.trim();
            if (url.includes('drive.google.com')) {
                const idMatch = url.match(/[-\w]{25,}/);
                if (idMatch) return `https://drive.google.com/uc?export=view&id=${idMatch[0]}`;
            }
            return url;
        }

        async function carregarProdutos() {
            try {
                const response = await fetch(urlPlanilha + '&nocache=' + new Date().getTime());
                const data = await response.text();
                
                const linhas = data.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                const produtos = [];

                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    
                    if (colunas.length >= 2) {
                        const id = colunas[0] || i;
                        const nome = colunas[1] || '';
                        const marca = colunas[2] || '';
                        
                        if (!nome) continue;

                        let precoNum = 0;
                        if (colunas[3]) {
                            const precoLimpo = colunas[3].replace('R$', '').replace('.', '').replace(',', '.').trim();
                            precoNum = parseFloat(precoLimpo) || 0;
                        }

                        let tamanhosArr = ['P', 'M', 'G', 'GG'];
                        if (colunas[4] && colunas[4].trim() !== '') {
                            tamanhosArr = colunas[4].split(/[-,-]/).map(t => t.trim());
                        }

                        const foto = formatarUrlImagem(colunas[5]);

                        produtos.push({
                            id: id,
                            nome: nome,
                            marca: marca,
                            preco: precoNum,
                            tamanhos: tamanhosArr,
                            foto: foto
                        });
                    }
                }

                renderizarProdutos(produtos);
            } catch (error) {
                console.error("Erro ao carregar produtos:", error);
            }
        }

        function renderizarProdutos(produtos) {
            const container = document.getElementById('products-container');
            if (!container) return;
            
            if (produtos.length === 0) {
                container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Nenhum produto cadastrado no momento.</p>';
                return;
            }

            container.innerHTML = '';

            produtos.forEach((prod, index) => {
                const tamanhosOptions = prod.tamanhos.map(t => `<option value="${t}">${t}</option>`).join('');
                
                const cardHTML = `
                    <div class="product-card">
                        <img src="${prod.foto}" class="product-img" alt="${prod.nome}" onerror="this.src='https://via.placeholder.com/300x220?text=Sem+Foto'">
                        <div class="product-title">${prod.nome}</div>
                        <div class="product-brand">${prod.marca}</div>
                        <div class="product-price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
                        
                        <div class="select-group">
                            <label>Tamanho:</label>
                            <select id="size-${index}">
                                ${tamanhosOptions}
                            </select>
                        </div>

                        <button class="btn-add" onclick="adicionarAoCarrinho('${prod.nome}', '${prod.marca}', 'size-${index}', ${prod.preco})">
                            Adicionar à Sacola
                        </button>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function adicionarAoCarrinho(nome, marca, sizeId, preco) {
            const tamanho = document.getElementById(sizeId).value;
            sacola.push({ nome, marca, tamanho, preco });
            atualizarSacola();
        }

        function atualizarSacola() {
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');
            if (cartCount) cartCount.innerText = `${sacola.length} item(ns)`;
            const total = sacola.reduce((sum, item) => sum + item.preco, 0);
            if (cartTotal) cartTotal.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        // Função atualizada: cria uma preferência de pagamento e redireciona pro Checkout Pro
        async function pagarComPixDireto() {
            if (sacola.length === 0) {
                alert("Sua sacola está vazia!");
                return;
            }

            try {
                const response = await fetch('/api/criar-pagamento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itens: sacola })
                });

                const data = await response.json();

                if (response.ok && data.linkPagamento) {
                    window.location.href = data.linkPagamento;
                } else {
                    console.error("Erro ao criar pagamento:", data);
                    alert('Não foi possível iniciar o pagamento agora. Você pode finalizar pelo WhatsApp.');
                }
            } catch (err) {
                console.error("Erro de conexão:", err);
                alert('Erro ao conectar com o servidor de pagamento.');
            }
        }

        // Ação para Enviar Pedido pelo WhatsApp
        function enviarWhatsApp() {
            if (sacola.length === 0) {
                alert("Sua sacola está vazia!");
                return;
            }

            let textoMensagem = "Olá! Gostaria de fazer o seguinte pedido:\n\n";
            let total = 0;

            sacola.forEach((item, index) => {
                textoMensagem += `${index + 1}. *${item.nome}* (${item.marca})\n   • Tamanho: ${item.tamanho}\n   • Valor: R$ ${item.preco.toFixed(2).replace('.', ',')}\n\n`;
                total += item.preco;
            });

            textoMensagem += `💰 *Valor Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

            const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(textoMensagem)}`;
            window.open(linkWhatsApp, '_blank');
        }

        function copiarPix() {
            const copyText = document.getElementById("pix-code-text");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Código Pix copiado com sucesso!");
        }

        function fecharModalPix() {
            document.getElementById('modal-pix').style.display = 'none';
        }

        carregarProdutos();
    </script>
</body>
</html>
